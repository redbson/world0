[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "world0"
version = "0.2.0"
description = "A cognitive concept-world system for LLM Agents"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
]

# LLM providers power core text extraction (ingest_text). The agent/web/gui
# interfaces and their extras now live in the separate `world0-pkm` project.
[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
all = [
    "openai>=1.0",
    "anthropic>=0.30",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "openai>=1.0",
    "anthropic>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"world0.visualization" = ["template.html"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "src/world0/concepts/tests",
    "src/world0/dynamics/tests",
    "src/world0/spaces/tests",
    "src/world0/visualization/tests",
    "src/world0/world/tests",
]
